name: Prompt Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  run-prompt:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'prompt:')"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install openai==1.45.0 pygit2

      - name: Extract prompt from commit message
        id: extract
        run: |
          PROMPT=$(echo "${{ github.event.head_commit.message }}" | sed -n 's/.*prompt://p' | xargs)
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Run AI code generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, subprocess
          from openai import OpenAI

          prompt = os.environ.get("PROMPT", "").strip()
          if not prompt:
              print("⚠️ No prompt found, skipping.")
              exit(0)

          print(f"🧠 Running model on prompt: {prompt}")
          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

          # Envia prompt ao GPT-5-mini
          response = client.chat.completions.create(
              model="gpt-5-mini",
              messages=[
                  {"role": "system", "content": "Você é um assistente de programação. Responda apenas com código e formato JSON válido."},
                  {"role": "user", "content": prompt}
              ],
          )

          reply = response.choices[0].message.content.strip()
          print("✅ AI response received")

          os.makedirs("responses", exist_ok=True)
          with open("responses/ai_response.json", "w", encoding="utf-8") as f:
              f.write(reply)

          PY

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add responses/ai_response.json
          git commit -m "🤖 AI update from prompt"
          git push

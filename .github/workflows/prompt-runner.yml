name: Chunk & Send to GPT-5 (fixed 1000 tokens)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file in repo (ex: docs/large_input.txt)'
        required: true
        default: 'input.txt'

jobs:
  chunk_and_send:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      INPUT_FILE: ${{ github.event.inputs.input_file }}
      MAX_TOKENS_PER_CHUNK: '1000'
      TEMPERATURE: '0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Chunk file and send to OpenAI
        run: |
          python - <<'PY'
          import os, json, time
          from pathlib import Path
          import openai
          try:
              import tiktoken
          except Exception:
              tiktoken = None

          model = os.environ.get('MODEL', 'gpt-5-mini')
          api_key = os.environ.get('OPENAI_API_KEY')
          input_path = os.environ.get('INPUT_FILE', 'input.txt')
          max_tokens = int(os.environ.get('MAX_TOKENS_PER_CHUNK', '1000'))
          temperature = float(os.environ.get('TEMPERATURE', '0.0'))

          openai.api_key = api_key
          p = Path(input_path)
          if not p.exists():
              raise SystemExit(f"❌ Input file not found: {input_path}")

          text = p.read_text(encoding='utf-8')

          # Escolhe encoding adequado
          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding('cl100k_base')

          def estimate_tokens(s: str) -> int:
              return len(encoding.encode(s)) if encoding else max(1, len(s)//4)

          def split_by_tokens(s: str, max_toks: int):
              if encoding:
                  ids = encoding.encode(s)
                  return [encoding.decode(ids[i:i+max_toks]) for i in range(0, len(ids), max_toks)]
              else:
                  # fallback aproximado
                  return [s[i:i+max_toks*4] for i in range(0, len(s), max_toks*4)]

          chunks = split_by_tokens(text, max_tokens)
          print(f"📌 Total chunks: {len(chunks)}")

          for i, chunk in enumerate(chunks, 1):
              print(f"\n--- Sending chunk {i}/{len(chunks)} ---")
              try:
                  resp = openai.ChatCompletion.create(
                      model=model,
                      messages=[{"role": "user", "content": chunk}],
                      temperature=temperature
                  )
                  output = resp.choices[0].message["content"]
                  print(f"✅ Response {i}: {output[:200]}...\n")
              except Exception as e:
                  print(f"❌ Error on chunk {i}: {e}")
              time.sleep(10)
          PY

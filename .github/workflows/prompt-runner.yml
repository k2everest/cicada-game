name: Prompt Runner

on:
  push:
    branches:
      - master
      

jobs:
  run-prompt:
    if: "contains(github.event.head_commit.message, 'prompt:')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken jq

      - name: Extrair prompt do commit
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p')
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Preparar contexto do repositório
        id: get-context
        run: |
          set -e
          # snapshot inicial
          if [ ! -f .context_initialized.flag ]; then
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.html

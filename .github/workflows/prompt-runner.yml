name: Prompt Runner (Smart Diff & Chunked Send)

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'responses/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  run_prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      MAX_TOKENS_PER_CHUNK: '1000'
      TEMPERATURE: '1.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Detect changed files
        id: diff
        run: |
          mkdir -p responses
          if [ ! -f .context_initialized.flag ]; then
            echo "📌 First run: sending entire repo"
            find . -type f ! -path "./.git/*" ! -path "./responses/*" ! -path "./.github/*" -print > modified_files.txt
            touch .context_initialized.flag
          else
            git fetch --depth=2
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              git diff --name-only HEAD~1 HEAD > modified_files.txt
            else
              echo "⚠️ No previous commit found, sending all files."
              find . -type f ! -path "./.git/*" ! -path "./responses/*" ! -path "./.github/*" -print > modified_files.txt
            fi
          fi

      - name: Build grouped input
        run: |
          TMP_FILE=$(mktemp)
          GROUP_SIZE=10000
          echo "📑 Building grouped input..."
          while read file; do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file")
              if [ "$SIZE" -gt 1000000 ]; then
                echo "⚠️ Skipping large file: $file ($SIZE bytes)"
                continue
              fi
              echo "----- FILE: $file -----" >> "$TMP_FILE"
              cat "$file" >> "$TMP_FILE"
              echo "\n" >> "$TMP_FILE"
            fi
          done < modified_files.txt
          mv "$TMP_FILE" input.txt
          echo "✅ Input built."

      - name: Chunk and send to GPT
        run: |
          python - <<'PY'
          import os, json, time
          from pathlib import Path
          from openai import OpenAI
          try:
              import tiktoken
          except Exception:
              tiktoken = None

          model = os.environ.get('MODEL', 'gpt-5-mini')
          api_key = os.environ.get('OPENAI_API_KEY')
          max_tokens = int(os.environ.get('MAX_TOKENS_PER_CHUNK', '1000'))
          temperature = float(os.environ.get('TEMPERATURE', '1.0'))

          client = OpenAI(api_key=api_key)
          input_path = Path("input.txt")
          if not input_path.exists():
              raise SystemExit("❌ input.txt not found.")

          text = input_path.read_text(errors='ignore')

          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding('cl100k_base')

          def estimate_tokens(s):
              return len(encoding.encode(s)) if encoding else max(1, len(s)//4)

          def chunk_text(text, max_tokens):
              parts, current, current_tokens = [], [], 0
              for line in text.splitlines(keepends=True):
                  lt = estimate_tokens(line)
                  if current_tokens + lt > max_tokens:
                      parts.append("".join(current))
                      current, current_tokens = [line], lt
                  else:
                      current.append(line)
                      current_tokens += lt
              if current:
                  parts.append("".join(current))
              return parts

          chunks = chunk_text(text, max_tokens)
          print(f"🚀 Sending {len(chunks)} chunks...")

          Path("responses").mkdir(exist_ok=True)

          for i, chunk in enumerate(chunks, 1):
              print(f"--- Sending chunk {i}/{len(chunks)} ---")
              try:
                  response = client.chat.completions.create(
                      model=model,
                      messages=[
                          {"role": "system", "content": "You are a programming assistant integrated with GitHub Actions. Respond only in valid JSON."},
                          {"role": "user", "content": chunk}
                      ]
                  )
                  reply = response.choices[0].message.content.strip()
                  Path(f"responses/chunk_{i:04d}.json").write_text(reply, encoding="utf-8")
                  time.sleep(0.5)
              except Exception as e:
                  print(f"❌ Error on chunk {i}: {e}")
          print("✅ All chunks processed.")
          PY

      - name: Commit responses
        run: |
          git config --global user.name "Prompt Runner Bot"
          git config --global user.email "bot@github.actions"
          git add responses/*.json || true
          if git diff --cached --quiet; then
            echo "🟡 No new responses to commit."
          else
            git commit -m "🤖 prompt: update responses"
            git push
          fi

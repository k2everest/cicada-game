name: 🤖 Prompt Runner


on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/prompts/**'

jobs:
  run-prompt:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🧠 Executar prompt se houver commit com "prompt:"
        id: run
        if: contains(github.event.head_commit.message, 'prompt:')
        run: |
          set -e
          echo "🧩 Executando prompt..."
          
          # Extrai o conteúdo do arquivo de prompt
          PROMPT_FILE=$(find .github/prompts -type f | head -n 1)
          echo "🧠 Lendo prompt de: $PROMPT_FILE"
          PROMPT_CONTENT=$(cat "$PROMPT_FILE")
          
          # Envia o prompt para a API do OpenAI
          echo "💬 Enviando prompt..."
          RESPONSE=$(curl -s -X POST "https://api.openai.com/v1/responses" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-5",
              "input": '"$(jq -Rs <<< "$PROMPT_CONTENT")"'
            }')

          # Extrai o conteúdo de resposta (seguro)
          echo "$RESPONSE" | jq -r '.output_text' > ai_raw.txt

          echo "🧩 Aplicando alterações com segurança..."
          AI_RAW=$(cat ai_raw.txt)
          jq -Rn --arg content "$AI_RAW" '[{path:"README.md", content:$content}]' > ai_output.json
          
          cat ai_output.json | jq .
          
          # Aplica o conteúdo no repositório
          echo "$AI_RAW" > README.md

      - name: 💾 Commitar resultado
        if: steps.run.conclusion == 'success'
        run: |
          set -e
          git config --global user.name "prompt-runner-bot"
          git config --global user.email "bot@github.com"
          git add README.md
          git commit -m "🧠 auto: atualização de conteúdo a partir do prompt"
          git push

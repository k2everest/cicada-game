name: Prompt Runner

on:
  push:
    branches:
      - master

jobs:
  run-prompt:
    if: contains(github.event.head_commit.message, 'prompt:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extrair prompt do commit
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p' | xargs)
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "🧠 Prompt detectado: $PROMPT"

      - name: Preparar contexto do repositório
        id: get-context
        run: |
          set -e
          echo "🔍 Preparando contexto..."
          if [ ! -f .context_initialized.flag ]; then
            echo "📦 Primeira execução — gerando contexto completo."
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.html" -o -name "*.css" -o -name "*.md" \) \
              -exec sh -c 'echo "==== $1 ===="; tr -d "\000" < "$1"' _ {} \; > full_context.txt
            touch .context_initialized.flag
            git config user.name "prompt-bot"
            git config user.email "bot@example.com"
            git add .context_initialized.flag
            git commit -m "Initialize context snapshot" || true
            git push origin master || true
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              FILES=$(git ls-files)
            fi
            CONTEXT=""
            for F in $FILES; do
              if [[ -f "$F" ]]; then
                CONTEXT+="==== $F ====\n"
                CONTEXT+="$(tr -d '\000' < "$F")\n"
              fi
            done
            echo -e "$CONTEXT" > full_context.txt
          fi

      - name: Rodar ChatGPT (OpenAI API)
        id: ai
        run: |
          echo "🚀 Enviando prompt para GPT-5..."
          RESPONSE=$(jq -n \
            --arg prompt "${{ steps.get-prompt.outputs.prompt }}" \
            --rawfile context full_context.txt \
            '{
              "model": "gpt-5-mini",
              "messages": [
                {"role": "system", "content": "Você é um assistente de programação. Responda SOMENTE com JSON válido no formato: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}]"},
                {"role": "user", "content": $context},
                {"role": "user", "content": $prompt}
              ]
            }' | curl -s https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
              -d @- )
          
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > changes.json
          echo "✅ Resposta recebida de GPT:"
          cat changes.json

      - name: Validar JSON
        run: |
          echo "🧩 Validando JSON..."
          cat changes.json | jq empty

      - name: Aplicar mudanças nos arquivos
        run: |
          echo "✏️ Aplicando mudanças..."
          cat changes.json | jq -c '.[]' | while read -r i; do
            FILE=$(echo "$i" | jq -r '.path')
            CONTENT=$(echo "$i" | jq -r '.content')
            mkdir -p "$(dirname "$FILE")"
            echo "$CONTENT" > "$FILE"
            echo "📝 Atualizado: $FILE"
          done

      - name: Commit automático
        run: |
          echo "💾 Fazendo commit das alterações..."
          git config user.name "prompt-bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "AI applied changes for prompt: ${{ steps.get-prompt.outputs.prompt }}" || echo "Nada para commitar"
          git push origin master || echo "Push falhou ou sem mudanças"

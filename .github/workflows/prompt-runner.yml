name: Prompt Runner (AI-driven repo edits)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ai-prompt-runner:
    name: Process commit prompt with AI
    runs-on: ubuntu-latest
    # Only run when commit message contains 'prompt:' and not triggered by the actions bot
    if: contains(github.event.head_commit.message, 'prompt:') && github.actor != 'github-actions[bot]' && github.actor != 'Prompt Bot'

    env:
      # tunables
      CHUNK_BYTES: 15000
      MAX_TOTAL_CONTEXT: 200000
      MAX_COMPLETION_TOKENS: 2000
      MODEL: "gpt-5-mini-2025-08-07"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Prompt Bot"
          git config user.email "actions@github.com"

      - name: Extract prompt from commit
        id: get_prompt
        run: |
          RAW="${{ github.event.head_commit.message }}"
          # Extract everything after 'prompt:' (first occurrence)
          PROMPT=$(echo "$RAW" | sed -n 's/.*prompt:\(.*\)/\1/p' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "Detected prompt:"
          echo "$PROMPT"

      - name: Compute changed files (diff-only)
        id: get_diff
        run: |
          # Try safe diffs: if HEAD~1 doesn't exist (initial commit) fallback to all files
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > changed_files.txt || true
          else
            git ls-files > changed_files.txt || true
          fi
          echo "Changed files:"
          cat changed_files.txt | sed -n '1,200p'

      - name: Build reduced context (diff files only) and chunk
        id: build_context
        run: |
          mkdir -p .prompt_runner_tmp
          CONTEXT_FILE=".prompt_runner_tmp/full_context.txt"
          : > "$CONTEXT_FILE"
          TOTAL=0
          # Only include text-like files commonly useful; skip binary large files
          while IFS= read -r F; do
            [ -z "$F" ] && continue
            if [ -f "$F" ]; then
              # limit to certain extensions to avoid huge binaries
              case "$F" in
                *.js|*.ts|*.py|*.json|*.md|*.html|*.css|*.yml|*.yaml|*.sh|*.txt|*.java|*.c|*.cpp|*.rs)
                  SIZE=$(wc -c < "$F" || echo 0)
                  if [ $((TOTAL + SIZE)) -gt $MAX_TOTAL_CONTEXT ]; then
                    echo "Context limit reached; skipping remaining files."
                    break
                  fi
                  echo "==== $F ====" >> "$CONTEXT_FILE"
                  # take last bytes (tail) to avoid head byte-count errors and to prefer recent content
                  tail -c "$CHUNK_BYTES" "$F" 2>/dev/null >> "$CONTEXT_FILE" || true
                  echo -e "\n" >> "$CONTEXT_FILE"
                  TOTAL=$((TOTAL + SIZE))
                  ;;
                *)
                  echo "Skipping (not text): $F"
                  ;;
              esac
            fi
          done < changed_files.txt
          echo "Context size bytes: $(wc -c < "$CONTEXT_FILE" || echo 0)"
          # Split into chunks
          mkdir -p .prompt_runner_tmp/chunks
          split -b "${CHUNK_BYTES}" "$CONTEXT_FILE" .prompt_runner_tmp/chunks/chunk_ || true
          COUNT=$(ls -1 .prompt_runner_tmp/chunks 2>/dev/null | wc -l || echo 0)
          echo "chunk_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Built $COUNT chunks"

      - name: Call AI for each chunk (with retry/backoff) and collect JSON outputs
        id: call_ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p logs
          OUT_FILE="logs/all_changes_combined.json"
          : > "$OUT_FILE"
          echo "[" > "$OUT_FILE.tmp"
          FIRST=1

          # function for exponential backoff retry
          call_api_with_retry() {
            local payload="$1"
            local attempt=1
            local max_attempts=5
            local backoff=2
            while [ $attempt -le $max_attempts ]; do
              HTTP=$(curl -s -w "\nHTTP_STATUS=%{http_code}\n" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d "$payload" \
                "https://api.openai.com/v1/chat/completions")
              STATUS=$(echo "$HTTP" | tr -d '\r' | awk -F'HTTP_STATUS=' 'NF>1{print $2; exit} {print "000"}')
              BODY=$(echo "$HTTP" | sed '/HTTP_STATUS=/,$d')
              echo "$BODY" > logs/response_raw_chunk_${attempt}.json
              if [ "$STATUS" = "200" ]; then
                echo "$BODY"
                return 0
              fi
              # Rate limit or 5xx -> retry
              echo "API call failed (status $STATUS). Attempt $attempt/$max_attempts. Retrying after $backoff s..."
              sleep $backoff
              backoff=$((backoff * 2))
              attempt=$((attempt + 1))
            done
            echo "API call failed after $max_attempts attempts. Last status: $STATUS"
            return 1
          }

          CHUNK_DIR=".prompt_runner_tmp/chunks"
          if [ ! -d "$CHUNK_DIR" ] || [ "$(ls -A $CHUNK_DIR 2>/dev/null | wc -l)" -eq 0 ]; then
            # No chunks (empty context) -> still call once with only prompt
            echo "No chunks found; sending only prompt"
            CONTEXT=""
            PAYLOAD=$(jq -n --arg model "$MODEL" --arg prompt "${{ steps.get_prompt.outputs.prompt }}" --arg context "$CONTEXT" \
              '{model:$model, messages:[ {role:"system", content:"Você é um assistente que gera alterações em formato JSON. Sempre retorne apenas JSON válido: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}] sem texto adicional."}, {role:"user", content: ($prompt + "\n\nContexto:\n" + $context)} ], max_completion_tokens: '"$MAX_COMPLETION_TOKENS"'}')
            HTTP_BODY=$(call_api_with_retry "$PAYLOAD") || (echo "AI call failed"; exit 1)
            # extract content and append if valid
            CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
            if [ -n "$CONTENT" ] && [ "$CONTENT" != "null" ]; then
              # ensure valid JSON
              echo "$CONTENT" > logs/tmp_response.json
              if jq empty logs/tmp_response.json >/dev/null 2>&1; then
                if [ $FIRST -eq 0 ]; then echo "," >> "$OUT_FILE.tmp"; fi
                jq -c '.[]' logs/tmp_response.json >> "$OUT_FILE.tmp"
                FIRST=0
                echo "Appended AI output (no-context call)"
              else
                echo "Invalid JSON from AI (no-context). Dumping response:"
                cat logs/tmp_response.json
              fi
            else
              echo "Empty content from AI (no-context)."
            fi
          else
            for CH in "$CHUNK_DIR"/*; do
              echo "Processing chunk: $CH"
              CTX=$(cat "$CH")
              PAYLOAD=$(jq -n --arg model "$MODEL" --arg prompt "${{ steps.get_prompt.outputs.prompt }}" --arg context "$CTX" \
                '{model:$model, messages:[ {role:"system", content:"Você é um assistente que gera alterações em formato JSON. Sempre retorne apenas JSON válido: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}] sem texto adicional."}, {role:"user", content: ($prompt + "\n\nContexto:\n" + $context)} ], max_completion_tokens: '"$MAX_COMPLETION_TOKENS"'}')
              HTTP_BODY=$(call_api_with_retry "$PAYLOAD") || (echo "AI call failed for chunk $CH"; continue)
              CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content' 2>/dev/null || echo "")
              if [ -n "$CONTENT" ] && [ "$CONTENT" != "null" ]; then
                echo "$CONTENT" > logs/tmp_response_chunk.json
                # Validate JSON
                if jq empty logs/tmp_response_chunk.json >/dev/null 2>&1; then
                  if [ $FIRST -eq 0 ]; then echo "," >> "$OUT_FILE.tmp"; fi
                  jq -c '.[]' logs/tmp_response_chunk.json >> "$OUT_FILE.tmp"
                  FIRST=0
                  echo "Appended valid JSON from chunk $CH"
                else
                  echo "Invalid JSON from AI for chunk $CH. Dumping raw:"
                  cat logs/tmp_response_chunk.json
                fi
              else
                echo "No content returned for chunk $CH"
              fi
            done
          fi

          echo "]" >> "$OUT_FILE.tmp"
          # Post-process to build a valid JSON array (if no elements, produce empty array)
          jq -s 'add' "$OUT_FILE.tmp" > "$OUT_FILE" 2>/dev/null || echo "[]" > "$OUT_FILE"
          echo "Combined AI changes saved to $OUT_FILE"
          ls -lah logs || true

      - name: Validate combined JSON and prepare changes list
        id: validate
        run: |
          set -e
          OUT_FILE="logs/all_changes_combined.json"
          if ! jq empty "$OUT_FILE" >/dev/null 2>&1; then
            echo "No valid combined JSON or JSON invalid. Showing dump:"
            cat "$OUT_FILE"
            echo "No changes will be applied."
            echo "applied=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # normalize to array
          jq -c '.[]' "$OUT_FILE" > logs/changes_lines.txt
          echo "changes_count=$(wc -l < logs/changes_lines.txt || echo 0)" >> $GITHUB_OUTPUT
          echo "applied=true" >> $GITHUB_OUTPUT

      - name: Apply changes (only if valid)
        if: steps.validate.outputs.applied == 'true'
        run: |
          set -e
          CHANGED=0
          while IFS= read -r line; do
            PATH_FILE=$(echo "$line" | jq -r '.path')
            CONTENT=$(echo "$line" | jq -r '.content')
            # Create directories
            mkdir -p "$(dirname "$PATH_FILE")"
            # If file doesn't exist or differs, write and mark changed
            if [ -f "$PATH_FILE" ]; then
              # compare content safely
              echo "$CONTENT" > .prompt_runner_tmp/new_content.tmp
              if ! cmp -s .prompt_runner_tmp/new_content.tmp "$PATH_FILE"; then
                mv .prompt_runner_tmp/new_content.tmp "$PATH_FILE"
                echo "UPDATED: $PATH_FILE"
                CHANGED=1
              else
                rm -f .prompt_runner_tmp/new_content.tmp
                echo "UNCHANGED: $PATH_FILE"
              fi
            else
              echo "$CONTENT" > "$PATH_FILE"
              echo "CREATED: $PATH_FILE"
              CHANGED=1
            fi
          done < logs/changes_lines.txt
          echo "changes_detected=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit and push only if there are changes
        if: steps.validate.outputs.applied == 'true' && steps.apply_changes.outputs.changes_detected == '1'
        run: |
          set -e
          # set git identity already configured earlier
          git add -A
          # Ensure we don't commit any logs or temp files
          git restore --staged logs || true
          git restore --staged .prompt_runner_tmp || true
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          PROMPT_SUMMARY=$(echo "${{ steps.get_prompt.outputs.prompt }}" | tr '\n' ' ' | cut -c1-200)
          git commit -m "🤖 AI applied changes for prompt: $PROMPT_SUMMARY"
          git push origin main

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-runner-logs
          path: |
            logs/
            .prompt_runner_tmp || true

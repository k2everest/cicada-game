name: 🧠 Prompt Runner (GPT-5-mini)

on:
  push:
    branches:
      - master

jobs:
  run-prompt:
    if: contains(github.event.head_commit.message, 'prompt:')
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🧠 Extrair prompt do commit
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p')
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "📥 Prompt extraído: $PROMPT"

      - name: 🧱 Preparar contexto (repo ou diff)
        id: prepare-context
        run: |
          set -e
          if [ ! -f .context_initialized.flag ]; then
            echo "📦 Primeira execução — enviando repo completo..."
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./responses/*" \
              -not -path "./.github/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.html" -o -name "*.css" -o -name "*.md" \) \
              -exec sh -c 'echo "==== {} ===="; tr -d "\000" < "{}"' \; > full_context.txt
            touch .context_initialized.flag
            echo "✅ Contexto inicial criado (repo completo)."
          else
            echo "🔍 Repositório já inicializado — enviando apenas diff..."
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              FILES=$(git ls-files)
            fi
            CONTEXT=""
            for F in $FILES; do
              if [[ -f "$F" ]]; then
                CONTEXT+="==== $F ====\n"
                CONTEXT+=$(tr -d "\000" < "$F")
                CONTEXT+="\n"
              fi
            done
            echo -e "$CONTEXT" > full_context.txt
            echo "✅ Contexto (diff) gerado com sucesso."
          fi

      - name: 🔢 Estimar tokens (tamanho do contexto)
        run: |
          TOKENS=$(wc -c < full_context.txt)
          echo "📊 Estimativa aproximada de tokens usados: $((TOKENS / 4))"

      - name: 🤖 Enviar prompt para GPT-5-mini
        id: ai
        run: |
          RESPONSE=$(jq -n \
            --arg prompt "${{ steps.get-prompt.outputs.prompt }}" \
            --rawfile context full_context.txt \
            '{
              "model": "gpt-5-mini",
              "messages": [
                {"role": "system", "content": "Você é um assistente de programação autônomo. Analise o contexto do repositório e apli

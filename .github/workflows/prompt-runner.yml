name: Prompt Runner

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  run-prompt:
    # Evita loops (não roda em commits do próprio bot)
    if: contains(github.event.head_commit.message, 'prompt:') && github.actor != 'github-actions[bot]' && github.actor != 'prompt-bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "prompt-bot"
          git config user.email "bot@github.local"

      - name: Extrair prompt do commit
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p' | xargs)
          echo "Prompt extraído: $PROMPT"
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Gerar contexto (somente arquivos alterados)
        id: get-context
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            FILES=$(git ls-files)
          fi
          CONTEXT=""
          for F in $FILES; do
            if [[ -f "$F" ]]; then
              CONTEXT+="==== $F ====\n"
              CONTEXT+=$(tr -d '\000' < "$F")
              CONTEXT+="\n"
            fi
          done
          echo -e "$CONTEXT" > full_context.txt
          echo "Contexto gerado com $(wc -c < full_context.txt) bytes."

      - name: Rodar ChatGPT (OpenAI API)
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🚀 Executando prompt via GPT-5..."
          JSON_PAYLOAD=$(jq -n \
            --arg model "gpt-5" \
            --arg prompt "${{ steps.get-prompt.outputs.prompt }}" \
            --rawfile context full_context.txt \
            '{
              model: $model,
              messages: [
                {
                  "role": "system",
                  "content": "Você é um assistente que edita código. Responda SOMENTE com JSON válido no formato: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}]"
                },
                {"role": "user", "content": $context},
                {"role": "user", "content": $prompt}
              ]
            }')

          echo "$JSON_PAYLOAD" | jq . > payload.json
          RESPONSE=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json)
          
          echo "$RESPONSE" > response_raw.json
          jq -r '.choices[0].message.content' response_raw.json > changes.json
          echo "✅ Resposta salva em changes.json"

      - name: Validar JSON retornado
        run: cat changes.json | jq empty

      - name: Aplicar mudanças
        run: |
          echo "🧩 Aplicando alterações..."
          jq -c '.[]' changes.json | while read -r item; do
            path=$(echo "$item" | jq -r '.path')
            content=$(echo "$item" | jq -r '.content')
            mkdir -p "$(dirname "$path")"
            echo "$content" > "$path"
            echo "Atualizado: $path"
          done

      - name: Commit e push
        run: |
          git add .
          git commit -m "🤖 AI applied changes from prompt commit" || echo "Nada para commitar."
          git push || echo "Nenhuma mudança para enviar."

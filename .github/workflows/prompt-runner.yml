name: Chunk & Send to GPT-5 (fixed 1000 tokens)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file in repo (ex: docs/large_input.txt)'
        required: true
        default: 'input.txt'

jobs:
  chunk_and_send:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      INPUT_FILE: ${{ github.event.inputs.input_file }}
      MAX_TOKENS_PER_CHUNK: '1000'
      TEMPERATURE: '0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Chunk file and send to OpenAI
        run: |
          python - <<'PY'
          import os, json, math, time
          from pathlib import Path
          import openai
          try:
              import tiktoken
          except Exception:
              tiktoken = None

          model = os.environ.get('MODEL', 'gpt-5-mini')
          api_key = os.environ.get('OPENAI_API_KEY')
          input_path = os.environ.get('INPUT_FILE', 'input.txt')
          max_tokens = 1000
          temperature = float(os.environ.get('TEMPERATURE', '0.0'))

          openai.api_key = api_key
          p = Path(input_path)
          if not p.exists():
              raise SystemExit(f"❌ Input file not found: {input_path}")

          text = p.read_text(encoding='utf-8')

          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding('cl100k_base')


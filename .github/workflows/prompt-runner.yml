name: Prompt Runner


on:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.java'
      - '**.yml'
      - '**.yaml'
      - '**.json'
      - '**.md'
      - '**.sh'
      - '**.txt'

jobs:
  run-prompt:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      MAX_TOKENS_PER_CHUNK: '1500'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Prepare input (full repo first run, diff afterwards)
        run: |
          mkdir -p responses
          echo "" > input.txt
          EXTENSIONS="py js ts java yml yaml json md sh txt"

          if [ ! -f responses/.first_run_done ]; then
            echo "📌 First run: sending entire repo"
            git ls-files > modified_files.txt
            touch responses/.first_run_done
          else
            if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
              echo "📌 Sending only modified files (diff)"
              git diff --name-only HEAD~1 HEAD > modified_files.txt
            else
              echo "📌 Only one commit found, sending all files"
              git ls-files > modified_files.txt
            fi
          fi

          while read file; do
            if [ -f "$file" ]; then
              ext="${file##*.}"
              size=$(wc -c <"$file")
              if echo "$EXTENSIONS" | grep -qw "$ext" && [ "$size" -le 500000 ]; then
                echo "----- FILE: $file -----" >> input.txt
                if [ -f responses/.first_run_done ]; then
                  if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
                    git diff HEAD~1 HEAD -- "$file" >> input.txt
                  else
                    cat "$file" >> input.txt
                  fi
                else
                  cat "$file" >> input.txt
                fi
                echo "" >> input.txt
              else
                echo "⚠️ Skipping irrelevant/large file: $file ($size bytes)"
              fi
            fi
          done < modified_files.txt

      - name: Chunk file and send to OpenAI
        run: |
          python - <<'PY'
          import os, time, json
          from pathlib import Path
          from openai import OpenAI
          try:
              import tiktoken
          except ImportError:
              tiktoken = None

          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          model = os.environ.get("MODEL", "gpt-5-mini")
          max_tokens = int(os.environ.get("MAX_TOKENS_PER_CHUNK", "1500"))

          input_path = Path("input.txt")
          if not input_path.exists():
              raise SystemExit("❌ input.txt not found")

          text = input_path.read_bytes().decode("utf-8", errors="ignore")

          # Encoding
          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding("cl100k_base")

          def split_by_tokens(s: str, max_toks: int):
              if encoding:
                  ids = encoding.encode(s)
                  return [encoding.decode(ids[i:i+max_toks]) for i in range(0, len(ids), max_toks)]
              else:
                  return [s[i:i+max_toks*4] for i in range(0, len(s), max_toks*4)]

          chunks = split_by_tokens(text, max_tokens)
          print(f"📌 Total chunks: {len(chunks)}")

          for i, chunk in enumerate(chunks, 1):
              print(f"\n--- Sending chunk {i}/{len(chunks)} ---")
              try:
                  resp = client.chat.completions.create(
                      model=model,
                      messages=[
                          {"role": "system", "content": "You are a programming assistant integrated with GitHub Actions. Always answer in strict JSON."},
                          {"role": "user", "content": chunk}
                      ]
                  )
                  output = resp.choices[0].message.content
                  out_file = Path("responses") / f"response_{i}.json"
                  with out_file.open("w", encoding="utf-8") as f:
                      f.write(output)
                  print(f"✅ Saved response {i} -> {out_file}")
              except Exception as e:
                  print(f"❌ Error on chunk {i}: {e}")
              time.sleep(3)
          PY

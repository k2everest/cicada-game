name: Prompt Runner Ultra (Incremental + Parallel)

on:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.java'
      - '**.yml'
      - '**.yaml'
      - '**.json'
      - '**.md'
      - '**.sh'
      - '**.txt'

jobs:
  run-prompt:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      MAX_TOKENS_PER_CHUNK: '8000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Prepare input incrementally
        run: |
          mkdir -p responses
          touch responses/state.json
          echo "" > input.txt
          EXTENSIONS="py js ts java yml yaml json md sh txt"

          echo "📦 Preparing incremental input..."
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path

          state_file = Path("responses/state.json")
          state = json.loads(state_file.read_text()) if state_file.exists() and state_file.stat().st_size else {}
          new_state = {}
          changed_files = []

          def sha1(path):
              h = hashlib.sha1()
              with open(path, "rb") as f:
                  while chunk := f.read(8192):
                      h.update(chunk)
              return h.hexdigest()

          exts = {"py","js","ts","java","yml","yaml","json","md","sh","txt"}
          for path in Path(".").rglob("*"):
              if path.is_file() and path.suffix.lstrip(".") in exts and path.stat().st_size <= 800000:
                  h = sha1(path)
                  new_state[str(path)] = h
                  if state.get(str(path)) != h:
                      changed_files.append(str(path))

          if not state:
              print("📌 First run — including all files.")
              changed_files = list(new_state.keys())
          else:
              print(f"📁 {len(changed_files)} files changed since last run.")

          with open("modified_files.txt", "w") as f:
              f.write("\n".join(changed_files))

          with open("responses/new_state.json", "w") as f:
              json.dump(new_state, f)
          PY

      - name: Build grouped input
        run: |
          echo "" > input.txt
          GROUP_SIZE=10000  # approx tokens per group
          CURRENT=0
          echo "📑 Building grouped input..."
          while read file; do
            if [ -f "$file" ]; then
              echo "----- FILE: $file -----" >> input.txt
              cat "$file" >> input.txt
              echo "\n" >> input.txt
            fi
          done < modified_files.txt
          echo "✅ Input built."

      - name: Chunk file and send to OpenAI (parallel)
        run: |
          python - <<'PY'
          import os, json, time, hashlib
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from openai import OpenAI
          try:
              import tiktoken
          except ImportError:
              tiktoken = None

          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          model = os.environ.get("MODEL", "gpt-5-mini")
          max_tokens = int(os.environ.get("MAX_TOKENS_PER_CHUNK", "8000"))

          input_path = Path("input.txt")
          text = input_path.read_bytes().decode("utf-8", errors="ignore")

          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding("cl100k_base")

          def split_by_tokens(s: str, max_toks: int):
              if encoding:
                  ids = encoding.encode(s)
                  return [encoding.decode(ids[i:i+max_toks]) for i in range(0, len(ids), max_toks)]
              else:
                  return [s[i:i+max_toks*4] for i in range(0, len(s), max_toks*4)]

          chunks = split_by_tokens(text, max_tokens)
          print(f"📌 Total chunks: {len(chunks)}")

          Path("responses/chunks").mkdir(exist_ok=True)

          def process_chunk(i, chunk):
              try:
                  resp = client.chat.completions.create(
                      model=model,
                      messages=[
                          {"role": "system", "content": "You are a programming assistant integrated with GitHub Actions. Always answer strictly in JSON."},
                          {"role": "user", "content": chunk}
                      ]
                  )
                  output = resp.choices[0].message.content
                  out_file = Path("responses/chunks") / f"chunk_{i}.json"
                  out_file.write_text(output, encoding="utf-8")
                  return (i, "ok")
              except Exception as e:
                  return (i, str(e))

          with ThreadPoolExecutor(max_workers=4) as executor:
              futures = [executor.submit(process_chunk, i, chunk) for i, chunk in enumerate(chunks, 1)]
              for fut in as_completed(futures):
                  i, status = fut.result()
                  print(f"✅ Chunk {i} done" if status == "ok" else f"❌ Chunk {i} error: {status}")
                  time.sleep(1)
          PY

      - name: Merge results and update state
        run: |
          echo "🧩 Merging chunk results..."
          python - <<'PY

name: Prompt Runner

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
    # roda só se a mensagem do commit contiver "prompt:"
    if: "contains(github.event.head_commit.message, 'prompt:')"

jobs:
  prepare-and-run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      INPUT_FILE: input.txt
      MAX_TOKENS_PER_CHUNK: '1000'
      TEMPERATURE: '0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare input file (only text files)
        run: |
          echo "" > input.txt
          git ls-files | while read file; do
            if file "$file" | grep -q text; then
              echo "----- FILE: $file -----" >> input.txt
              cat "$file" >> input.txt || true
              echo "" >> input.txt
            else
              echo "⚠️ Skipping binary: $file"
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Chunk file and send to OpenAI
        run: |
          python - <<'PY'

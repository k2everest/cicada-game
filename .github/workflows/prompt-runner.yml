name: Prompt Runner

on:
  push:
    paths:
      - 'prompt.txt'
  workflow_dispatch:
  

jobs:
  run-prompt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "prompt-bot"
          git config user.email "bot@github.local"

      - name: Preparar contexto
        run: |
          echo "🔧 Preparando contexto..."
          git diff HEAD~1 HEAD > diff.txt || echo "sem diff"
          head -c 12000 diff.txt > trimmed_diff.txt
          echo "Contexto cortado para 12k bytes."
          echo "Prompt atual:"
          cat prompt.txt

      - name: Rodar ChatGPT (OpenAI API)
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🚀 Enviando prompt para GPT-5..."
          RESPONSE=$(cat <<'JSON' | curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @- )
          {
            "model": "gpt-5-mini",
            "messages": [
              {
                "role": "system",
                "content": "Você é um assistente que edita código. Responda SOMENTE com JSON válido no formato: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}]."
              },
              {
                "role": "user",
                "content": "$(cat trimmed_diff.txt)"
              },
              {
                "role": "user",
                "content": "$(cat prompt.txt)"
              }
            ]
          }
          JSON

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > changes.json
          cat changes.json

      - name: Aplicar mudanças
        run: |
          echo "🧩 Aplicando alterações..."
          jq -c '.[]' changes.json | while read -r change; do
            path=$(echo "$change" | jq -r '.path')
            content=$(echo "$change" | jq -r '.content')
            mkdir -p "$(dirname "$path")"
            echo "$content" > "$path"
            echo "✅ Atualizado: $path"
          done

      - name: Commit e push
        run: |
          git add .
          git commit -m "🤖 Atualização automática via prompt.txt"
          git push

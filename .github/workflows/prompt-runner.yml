name: Chunk & Send to GPT-5 with Final Merge

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file in repo (ex: docs/large_input.txt)'
        required: true
        default: 'input.txt'
      max_tokens:
        description: 'Tokens por chunk (seguro: 1000)'
        required: false
        default: '1000'

jobs:
  chunk_and_send:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: gpt-5-mini
      INPUT_FILE: ${{ github.event.inputs.input_file }}
      MAX_TOKENS_PER_CHUNK: ${{ github.event.inputs.max_tokens }}
      TEMPERATURE: '0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai tiktoken

      - name: Chunk file and send to OpenAI
        run: |
          python - <<'PY'
          import os, json, math, time
          from pathlib import Path
          import openai
          try:
              import tiktoken
          except Exception:
              tiktoken = None

          model = os.environ.get('MODEL', 'gpt-5-mini')
          api_key = os.environ.get('OPENAI_API_KEY')
          input_path = os.environ.get('INPUT_FILE', 'input.txt')
          max_tokens = int(os.environ.get('MAX_TOKENS_PER_CHUNK', '1000'))
          temperature = float(os.environ.get('TEMPERATURE', '0.0'))

          openai.api_key = api_key
          p = Path(input_path)
          if not p.exists():
              raise SystemExit(f"❌ Input file not found: {input_path}")

          text = p.read_text(encoding='utf-8')

          encoding = None
          if tiktoken:
              try:
                  encoding = tiktoken.encoding_for_model(model)
              except Exception:
                  encoding = tiktoken.get_encoding('cl100k_base')

          def estimate_tokens(s: str) -> int:
              return len(encoding.encode(s)) if encoding else max(1, len(s)//4)

          def split_by_tokens(s: str, max_toks: int):
              if encoding:
                  ids = encoding.encode(s)
                  return [encoding.decode(ids[i:i+max_toks]) for i in range(0, len(ids), max_toks)]
              return [s[i:i+max_toks*4] for i in range(0, len(s), max_toks*4)]

          out_dir = Path('gpt_chunks_output')
          out_dir.mkdir(parents=True, exist_ok=True)

          chunks = split_by_tokens(text, max_tokens)
          print(f'📌 Total chunks: {len(chunks)}')

          results = []
          for idx, chunk in enumerate(chunks, start=1):
              out_file = out_dir / f'chunk_{idx:03d}.json'
              if out_file.exists():
                  print(f"⏭️ Skipping chunk {idx}, already processed")
                  results.append(str(out_file))
                  continue

              print(f'--- Sending chunk {idx}/{len(chunks)} (~{estimate_tokens(chunk)} tokens)')
              try:
                  response = openai.ChatCompletion.create(
                      model=model,
                      messages=[
                          {"role": "system", "content": f"This is chunk {idx} of {len(chunks)}. Summarize with JSON keys: summary, highlights, raw."},
                          {"role": "user", "content": chunk}
                      ],
                      temperature=temperature,
                      max_tokens=min(1024, max(256, max_tokens//2))
                  )
                  assistant_text = response['choices'][0]['message']['content']
                  payload = {
                      'chunk_index': idx,
                      'chunk_tokens': estimate_tokens(chunk),
                      'input_excerpt': chunk[:500],
                      'assistant': assistant_text,
                  }
                  out_file.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
                  results.append(str(out_file))
                  time.sleep(10)  # pausa para não estourar TPM
              except Exception as e:
                  print(f'❌ Error on chunk {idx}:', e)
                  (out_dir/f'chunk_{idx:03d}_failed.txt').write_text(chunk[:10000], encoding='utf-8')

          (out_dir/'chunks_index.json').write_text(json.dumps({'files': results}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('✅ Done. Outputs in gpt_chunks_output/')
          PY

      - name: Merge summaries into final document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out_dir = Path('gpt_chunks_output')
          index_file = out_dir/'chunks_index.json'
          if not index_file.exists():
              raise SystemExit("❌ No chunks_index.json found")

          index = json.loads(index_file.read_text(encoding='utf-8'))
          summaries, failed = [], []

          for f in index.get('files', []):
              p = Path(f)
              if p.exists():
                  data = json.loads(p.read_text(encoding='utf-8'))
                  summaries.append(f"### Chunk {data['chunk_index']}\n{data.get('assistant','')}\n")
              else:
                  failed.append(f)

          if failed:
              raise SystemExit(f"❌ Merge cancelado: {len(failed)} chunks faltando ou com erro: {failed}")

          merged = "\n\n".join(summaries)
          final_path = out_dir/'final_summary.txt'
          final_path.write_text(merged, encoding='utf-8')
          print(f"✅ Final summary generated at {final_path}")
          PY

      - name: Upload outputs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-chunks-output
          path: gpt_chunks_output/

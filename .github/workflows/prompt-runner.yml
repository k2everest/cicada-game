name: AI Prompt Runner

on:
  push:
    branches:
      - main
      - master
      

jobs:
  ai-prompt-runner:
    name: Run AI prompt if commit contains prompt
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'prompt:') && github.actor != 'github-actions[bot]'

    env:
      MODEL: "gpt-5-mini-2025-08-07"
      MAX_COMPLETION_TOKENS: 3000
      CHUNK_BYTES: 15000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Prompt Bot"
          git config user.email "actions@github.com"

      - name: Extract prompt text
        id: get_prompt
        run: |
          RAW="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$RAW" | sed -n 's/.*prompt:\(.*\)/\1/p' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "Detected prompt: $PROMPT"

      - name: Determine if first commit
        id: check_first
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "first_commit=0" >> $GITHUB_OUTPUT
          else
            echo "first_commit=1" >> $GITHUB_OUTPUT
            echo "No previous commit, sending full repo context"

      - name: Collect files for context
        id: collect_files
        run: |
          CONTEXT_FILE=".prompt_runner_tmp/context.txt"
          mkdir -p .prompt_runner_tmp
          : > "$CONTEXT_FILE"

          if [ "${{ steps.check_first.outputs.first_commit }}" = "1" ]; then
            # Primeira execução: todo o repositório
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.md" -o -name "*.html" -o -name "*.css" -o -name "*.py" -o -name "*.yml" -o -name "*.yaml" \) \
              -exec sh -c 'echo "==== $1 ===="; cat "$1"' _ {} \; >> "$CONTEXT_FILE"
          else
            # Segunda execução em diante: apenas diff
            git diff --name-only HEAD~1 HEAD | while read F; do
              [ -f "$F" ] || continue
              case "$F" in
                *.js|*.ts|*.py|*.json|*.md|*.html|*.css|*.yml|*.yaml)
                  echo "==== $F ====" >> "$CONTEXT_FILE"
                  tail -c "$CHUNK_BYTES" "$F" 2>/dev/null >> "$CONTEXT_FILE"
                  echo -e "\n" >> "$CONTEXT_FILE"
                  ;;
              esac
            done
          fi
          echo "context_file=$CONTEXT_FILE" >> $GITHUB_OUTPUT

      - name: Call GPT-5-mini with prompt
        id: call_ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT="${{ steps.get_prompt.outputs.prompt }}"
          CONTEXT=$(cat "${{ steps.collect_files.outputs.context_file }}" || echo "")
          PAYLOAD=$(jq -n --arg model "$MODEL" --arg prompt "$PROMPT" --arg context "$CONTEXT" \
            '{model:$model, messages:[{role:"system", content:"Você é um assistente que gera alterações em JSON no formato [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}] sem texto extra."},{role:"user", content:($prompt+"\n\nContexto:\n"+$context)}], max_completion_tokens:'"$MAX_COMPLETION_TOKENS"'}')
          RESPONSE=$(curl -s -H "Content-Type: application/json" -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD" "https://api.openai.com/v1/chat/completions")
          echo "$RESPONSE" > .prompt_runner_tmp/response.json
          jq -r '.choices[0].message.content' .prompt_runner_tmp/response.json > .prompt_runner_tmp/ai_output.json || echo "[]" > .prompt_runner_tmp/ai_output.json

      - name: Apply changes from AI JSON
        id: apply_changes
        run: |
          CHANGED=0
          while IFS= read -r line; do
            PATH_FILE=$(echo "$line" | jq -r '.path')
            CONTENT=$(echo "$line" | jq -r '.content')
            mkdir -p "$(dirname "$PATH_FILE")"
            if [ -f "$PATH_FILE" ]; then
              echo "$CONTENT" > .prompt_runner_tmp/new.tmp
              if ! cmp -s .prompt_runner_tmp/new.tmp "$PATH_FILE"; then
                mv .prompt_runner_tmp/new.tmp "$PATH_FILE"
                echo "UPDATED: $PATH_FILE"
                CHANGED=1
              else
                rm -f .prompt_runner_tmp/new.tmp
              fi
            else
              echo "$CONTENT" > "$PATH_FILE"
              echo "CREATED: $PATH_FILE"
              CHANGED=1
            fi
          done < <(jq -c '.[]' .prompt_runner_tmp/ai_output.json)
          echo "changes_detected=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit and push if there are changes
        if: steps.apply_changes.outputs.changes_detected == '1'
        run: |
          git add -A
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          PROMPT_SUMMARY=$(echo "${{ steps.get_prompt.outputs.prompt }}" | tr '\n' ' ' | cut -c1-200)
          git commit -m "🤖 AI applied changes for prompt: $PROMPT_SUMMARY"
          git push origin "$CURRENT_BRANCH"

name: Prompt Runner

on:
  push:
    branches:
      - master


jobs:
  run-prompt:
    if: contains(github.event.head_commit.message, 'prompt:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract prompt from commit message
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p')
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Prepare context snapshot
        id: get-context
        run: |
          set -e
          if [ ! -f .context_initialized.flag ]; then
            echo "📦 Creating full context snapshot..."
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.html" -o -name "*.css" -o -name "*.md" \) \
              -exec sh -c 'echo "==== $1 ===="; tr -d "\000" < "$1"' _ {} \; > full_context.txt
            touch .context_initialized.flag
            git config user.name "prompt-bot"
            git config user.email "bot@example.com"
            git add .context_initialized.flag
            git commit -m "Initialize context snapshot" || echo "Flag already exists"
            git push origin master || true
          else
            echo "🧩 Creating diff-based context..."
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              FILES=$(git ls-files)
            fi
            CONTEXT=""
            for F in $FILES; do
              if [[ -f "$F" ]]; then
                CONTEXT+="==== $F ====\n"
                CONTEXT+=$(tr -d "\000" < "$F")
                CONTEXT+="\n"
              fi
            done
            echo -e "$CONTEXT" > full_context.txt
          fi

      - name: Split context into token-safe chunks
        id: chunk
        run: |
          set -e
          mkdir -p chunks

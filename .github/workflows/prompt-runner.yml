name: Prompt Runner

on:
  push:
    branches:
      - master

jobs:
  run-prompt:
    if: contains(github.event.head_commit.message, 'prompt:')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v3

      - name: 🧠 Extrair prompt do commit
        id: get-prompt
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p' | tr -d '\r' | tr -d '\n')
          echo "PROMPT DETECTADO:"
          echo "$PROMPT"
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: 📂 Preparar contexto do repositório
        id: get-context
        run: |
          echo "Gerando contexto reduzido..."
          git ls-files | grep -E '\.(js|ts|py|json|html|css|md)$' | head -n 50 | while read -r f; do
            echo "==== $f ===="
            head -c 4000 "$f" || true
            echo
          done > full_context.txt
          echo "✅ Contexto salvo em full_context.txt"

      - name: 🤖 Rodar ChatGPT (OpenAI API)
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          echo "📡 Enviando requisição para OpenAI..."
          BODY=$(jq -n \
            --arg prompt "${{ steps.get-prompt.outputs.prompt }}" \
            --rawfile context full_context.txt \
            '{
              model: "gpt-5-mini",
              messages: [
                {"role": "system", "content": "Você é um assistente de código. Responda apenas com JSON válido. Formato obrigatório: [{\"path\":\"arquivo.ext\",\"content\":\"novo conteúdo\"}]"},
                {"role": "user", "content": $context},
                {"role": "user", "content": $prompt}
              ]
            }')

          echo "$BODY" > payload.json
          echo "📤 Corpo da requisição salvo em payload.json"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS=%{http_code}\n" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json \
            https://api.openai.com/v1/chat/completions)

          echo "$RESPONSE" > raw_response.txt
          echo "📬 Resposta crua da API salva em raw_response.txt"
          cat raw_response.txt | head -n 40

          HTTP_STATUS=$(grep HTTP_STATUS raw_response.txt | cut -d= -f2)
          RESPONSE_BODY=$(grep -v HTTP_STATUS raw_response.txt)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Erro HTTP $HTTP_STATUS:"
            echo "$RESPONSE_BODY"
            exit 1
          fi

          CONTENT=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content' || echo "")
          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "⚠️ Nenhum conteúdo recebido da API."
            exit 0
          fi

          echo "$CONTENT" > changes.json
          echo "✅ Conteúdo salvo em changes.json"
          cat changes.json | head -n 20

      - name: 🧩 Aplicar alterações
        run: |
          set -e
          echo "🧩 Aplicando alterações..."
          if ! jq empty changes.json >/dev/null 2>&1; then
            echo "⚠️ O arquivo changes.json não contém JSON válido:"
            cat changes.json
            exit 1
          fi

          cat changes.json | jq -c '.[]' | while read -r i; do
            FILE=$(echo "$i" | jq -r '.path')
            CONTENT=$(echo "$i" | jq -r '.content')
            mkdir -p "$(dirname "$FILE")"
            echo "$CONTENT" > "$FILE"
            echo "✅ Arquivo criado/atualizado: $FILE"
          done

      - name: 💾 Commit automático
        run: |
          git config user.name "prompt-bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "🤖 AI applied changes for prompt" || echo "Nada para commitar"
          git push origin master || echo "⚠️ Push falhou (sem mudanças ou permissão)"

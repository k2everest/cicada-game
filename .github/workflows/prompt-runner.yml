name: Prompt Runner

on:
  push:
    branches:
      - master

jobs:
  run-prompt:
    if: contains(github.event.head_commit.message, 'prompt:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extrair prompt do commit
        id: get-prompt
        run: |
          set -e
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "🧠 Mensagem do commit:"
          echo "$COMMIT_MSG"
          PROMPT=$(echo "$COMMIT_MSG" | sed -n 's/.*prompt:\(.*\)/\1/p')
          echo "🧩 Prompt extraído: $PROMPT"
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Preparar contexto do repositório
        id: get-context
        run: |
          set -e
          if [ ! -f .context_initialized.flag ]; then
            echo "🆕 Gerando contexto inicial..."
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              \( -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.html" -o -name "*.css" -o -name "*.md" \) \
              -exec sh -c 'echo "==== $1 ===="; tr -d "\000" < "$1"' _ {} \; > full_context.txt
            touch .context_initialized.flag
            git config user.name "prompt-bot"
            git config user.email "bot@example.com"
            git add .context_initialized.flag
            git commit -m "Initialize context snapshot" || echo "⚠️ Flag já existe"
            git push origin master || echo "⚠️ Push ignorado"
          else
            echo "♻️ Atualizando contexto incremental..."
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              FILES=$(git ls-files)
            fi
            CONTEXT=""
            for F in $FILES; do
              if [[ -f "$F" ]]; then
                CONTEXT+="==== $F ====\n"
                CONTEXT+=$(tr -d "\000" < "$F")
                CONTEXT+="\n"
              fi
            done
            echo -e "$CONTEXT" > full_context.txt
          fi
          echo "✅ Contexto pronto:"
          head -n 20 full_context.txt || echo "sem preview"

      - name: Rodar ChatGPT (OpenAI API)
        id: ai
        run: |
          set -e
          echo "🔍 Prompt a enviar:"
          echo "${{ steps.get-prompt.outputs.prompt }}"
          echo "🔍 Prévia do contexto (20 linhas):"
          head -n 20 full_context.txt || echo "sem contexto"

          echo "🚀 Enviando requisição para OpenAI..."
          jq -n \
            --arg prompt "${{ steps.get-prompt.outputs.prompt }}" \
            --rawfile context full_context.txt \
            '{
              model: "gpt-5",
              messages: [
                {"role": "system", "content": "Você é um assistente que edita código. Responda SOMENTE com JSON válido no formato [{path:\"arquivo.ext\",content:\"novo conteúdo\"}]"},
                {"role": "user", "content": $context},
                {"role": "user", "content": $prompt}
              ]
            }' > payload.json

          echo "🧾 Payload:"
          cat payload.json

          curl -s -D headers.txt -o body.txt https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d @payload.json

          echo "📦 Cabeçalhos da resposta:"
          cat headers.txt
          echo "📬 Corpo bruto da resposta:"
          cat body.txt

          jq -r '.choices[0].message.content' body.txt > changes.json || echo "⚠️ Falha ao extrair conteúdo"
          echo "✅ JSON extraído:"
          cat changes.json || echo "sem conteúdo"

      - name: Validar JSON
        run: |
          set -e
          if [ -s changes.json ]; then
            echo "✅ Validando JSON..."
            cat changes.json | jq empty
          else
            echo "⚠️ Arquivo changes.json está vazio!"
            exit 1
          fi

      - name: Aplicar mudanças nos arquivos
        run: |
          set -e
          echo "🧩 Aplicando mudanças..."
          cat changes.json | jq -c '.[]' | while read i; do
            FILE=$(echo $i | jq -r '.path')
            CONTENT=$(echo $i | jq -r '.content')
            mkdir -p $(dirname "$FILE")
            echo "$CONTENT" > "$FILE"
            echo "✅ Atualizado: $FILE"
          done

      - name: Commit automático
        run: |
          set -e
          git config user.name "prompt-bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "🤖 AI applied changes for prompt" || echo "⚠️ Nada para commitar"
          git push

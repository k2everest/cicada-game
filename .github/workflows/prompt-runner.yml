name: Prompt Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  run-prompt:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'prompt:')"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 📦 Install dependencies
        run: |
          pip install openai==1.45.0

      - name: 🧠 Extract prompt from commit message
        id: extract
        run: |
          PROMPT=$(echo "${{ github.event.head_commit.message }}" | sed -n 's/.*prompt://p' | xargs)
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "🧠 Prompt extraído: $PROMPT"

      - name: 🤖 Run AI code generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.extract.outputs.prompt }}
        run: |
          python - <<'PY'
          import os, json
          from openai import OpenAI

          prompt = os.envi
